services:
  server:
    build: ./server
    container_name: waresense-server
    environment:
      PORT: 4000
      JWT_SECRET: docker-dev-secret-change-in-production
      JWT_EXPIRES_IN: 15m
      NODE_ENV: development
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    restart: unless-stopped

  client:
    build: ./client
    container_name: waresense-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
